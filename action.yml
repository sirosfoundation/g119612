name: 'Setup tsl-tool'
description: 'Download and install a pre-built tsl-tool binary from a GitHub release'
inputs:
  version:
    description: 'tsl-tool version to install (e.g. v1.0.0). Use "latest" for the most recent release.'
    required: false
    default: 'latest'
  token:
    description: 'GitHub token for downloading release assets (defaults to GITHUB_TOKEN)'
    required: false
    default: ${{ github.token }}
runs:
  using: 'composite'
  steps:
    - name: Determine version
      id: version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        VERSION="$INPUT_VERSION"
        if [ "$VERSION" = "latest" ]; then
          # Follow the /latest redirect to get the tag name from the URL
          VERSION=$(curl -sfLI -o /dev/null -w '%{url_effective}' \
            "https://github.com/sirosfoundation/g119612/releases/latest" \
            | grep -o '[^/]*$')
        fi
        echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Determine platform
      id: platform
      shell: bash
      run: |
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64)  ARCH="amd64" ;;
          aarch64) ARCH="arm64" ;;
          arm64)   ARCH="arm64" ;;
        esac
        echo "os=$OS" >> "$GITHUB_OUTPUT"
        echo "arch=$ARCH" >> "$GITHUB_OUTPUT"

    - name: Download tsl-tool
      shell: bash
      run: |
        TAG="${{ steps.version.outputs.tag }}"
        OS="${{ steps.platform.outputs.os }}"
        ARCH="${{ steps.platform.outputs.arch }}"
        ASSET="tsl-tool-${OS}-${ARCH}"

        INSTALL_DIR="${HOME}/.local/bin"
        mkdir -p "$INSTALL_DIR"

        # Use the GitHub release browser download URL (no API parsing needed)
        URL="https://github.com/sirosfoundation/g119612/releases/download/${TAG}/${ASSET}"
        curl -sfL -o "$INSTALL_DIR/tsl-tool" "$URL"

        chmod +x "$INSTALL_DIR/tsl-tool"
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Verify installation
      shell: bash
      run: tsl-tool --version
