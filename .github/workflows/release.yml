name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install PKCS#11 headers
        run: sudo apt-get update && sudo apt-get install -y libsofthsm2-dev

      - name: Build
        run: |
          BINARY="tsl-tool-linux-amd64"
          go build -ldflags "-X main.Version=${{ github.ref_name }}" \
            -o "$BINARY" ./cmd/tsl-tool

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsl-tool-linux-amd64
          path: tsl-tool-linux-amd64

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "tsl-tool ${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
