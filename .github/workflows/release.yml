name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install PKCS#11 headers
        run: sudo apt-get update && sudo apt-get install -y libsofthsm2-dev

      - name: Build
        run: |
          BINARY="tsl-tool-linux-amd64"
          go build -ldflags "-X main.Version=${{ github.ref_name }}" \
            -o "$BINARY" ./cmd/tsl-tool

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tsl-tool-linux-amd64
          path: tsl-tool-linux-amd64

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* \
              --repo "${{ github.repository }}" \
              --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "${{ github.repository }}" \
              --title "tsl-tool $TAG" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
